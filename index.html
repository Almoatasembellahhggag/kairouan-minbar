<style>

.mark { position: absolute; transform: translate(-50%, -50%); width: clamp(18px, 1.7cqw, 30px); height: clamp(18px, 1.7cqw, 30px);
  border-radius: 50%; border: 0; background: rgba(18, 14, 10, .6); color: #f6f1e8; padding: 0; cursor: pointer;
  font-family: var(--label); font-weight: 500; font-size: clamp(9px, .85cqw, 14px); line-height: 1; display: grid; place-items: center;
  font-variant-numeric: tabular-nums; transition: opacity .15s, background .15s; }
.mark:hover { background: rgba(18, 14, 10, .9); }

.mark.sel { background: var(--sel); color: #fff; box-shadow: 0 0 0 2px #fff; z-index: 2; }

@media (min-width: 761px) { .views.docked { right: calc(min(380px, 38vw) + 20px); } .views.docked ~ .tools { max-width: calc(100vw - min(380px, 38vw) - 40px); } }

:is(.tools button, .tools select, .tools input, .mark, .card button, summary):focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.card { position: fixed; z-index: 11; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));

@media (max-width: 760px) { .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); left: calc(env(safe-area-inset-left, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); width: auto; max-height: 50vh; } }
.card > * { flex: none; }
.close { align-self: flex-end; font-family: var(--label); font-size: .85rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.head { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.head b { font-family: var(--label); font-weight: 600; font-size: 2.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6em; }

.note .src { font-family: var(--label); font-size: .78rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.note p { margin: 0; }
.note q { font-style: italic; }
.note.inf p { color: var(--muted); font-size: .93rem; }
.empty { color: var(--muted); margin: 0; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.fig img { width: 100%; height: auto; max-height: 420px; object-fit: contain; background: var(--stage); border-radius: 3px; }

.field { display: flex; flex-direction: column; gap: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 5px; }
.thumb { position: relative; padding: 0; border: 0; background: var(--stage); border-radius: 3px; cursor: pointer; aspect-ratio: 1; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.thumb .n.zero { background: #b3261e; }
.fig img { cursor: zoom-in; }
.geomode .filtering .shade { opacity: .55; }
.geomode .mark.hit { background: var(--sel); color: #fff; box-shadow: 0 0 0 2px #fff; }
.geomode .mark:not(.hit):not(.new) { background: rgba(18, 14, 10, .6); box-shadow: none; }
.geomode .filtering .mark:not(.hit) { opacity: .85; }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; font-family: var(--label); }
.counts div { display: flex; flex-direction: column; gap: 1px; }

.photomode .filtering .shade { opacity: .55; }

.photomode .mark.hit { background: var(--sel); color: #fff; box-shadow: 0 0 0 2px #fff; }
#lb { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; overflow: auto; background: rgba(0,0,0,.93); padding: 12px; }

#lb .chips { justify-content: center; margin-top: 6px; }
#lb .chip { color: #f3ede3; }
.tools > a.linkb { color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; text-decoration: none; }

.edit { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--accent); border-radius: 6px; font-family: var(--label); font-size: .9rem; }

}
function showErr(t) {

  b.textContent = "Page error: " + t;

  const isN = n => Number.isInteger(+n) && +n >= 1 && +n <= 79;
  const seen = new Set();
  Object.entries(raw.numbers || {}).forEach(([k, m]) => { if (isN(k) && isN(m) && !seen.has(+m)) { seen.add(+m); out.numbers[+k] = +m; } });

  if (taken.size !== 79) out.numbers = {};   // a broken numbering is ignored whole
  Object.entries(raw.panels || {}).forEach(([n, p]) => {
    if (!isN(n) || !p || typeof p !== "object") return;
    const q = {};
    if (p.num === "yes" || p.num === "no") q.num = p.num;
    if (p.cre === "yes" || p.cre === "no" || p.cre === "moved") q.cre = p.cre;

    out.geo.slots = [...new Set((raw.geo.slots || []).filter(s => SLOT[s]))];
  }
  Object.entries(raw.photos || {}).forEach(([id, p]) => {
    if (!/^[a-z0-9]{1,8}$/.test(id) || !p || !Array.isArray(p.panels)) return;
    out.photos[id] = {panels: [...new Set(p.panels.map(Number).filter(isN))].sort((a, b) => a - b), whole: p.whole === true};

    let moved = false;
    const move = m => {

      moved = true; sc.classList.add("panning");
      sc.scrollLeft = l0 - (m.clientX - x0); sc.scrollTop = t0 - (m.clientY - y0);
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      sc.classList.remove("panning");
      if (moved) { panned = true; setTimeout(() => { panned = false; }, 0); }
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });

  sc.addEventListener("dragstart", e => e.preventDefault());

function toggleGeoPanel(n) {

function renderGeoCard() {

      <div><b>${c.before}</b><span>of 79 before 1907</span><span>${c.bt.rect}/52 rectangles</span><span>${c.bt.tri}/10 triangles</span><span>${c.bt.bal}/17 balustrade</span></div>
      <div><b>${c.after}</b><span>of ${c.afterTotal} in Creswell</span><span>${c.at.rect}/52 rectangles</span><span>${c.at.tri}/10 triangles</span><span>${c.at.bal}/16 balustrade</span></div>

      ${nw.length ? `<div class="field"><span class="lab">Marked new panels</span><div class="chips">${nw.map(id => `<button type="button" class="chip" data-gs="${id}" aria-label="Unmark new panel, ${slotName(id)}">N: ${slotName(id)} ×</button>`).join("")}</div></div>` : ""}
    </div>`;

function togglePanel(n) {

}
function stepPhoto(d) {

}
const photoList = () => { const l = PHOTOS.filter(p => photoFilter === "all" || !placed(p.id) || p.id === curPhoto); return l.length ? l : PHOTOS; };
function toggleNew(id) {

function parsePanels(t) {

  t.split(/[\s,;]+/).filter(Boolean).forEach(x => {

    const a = +m[1], b = +(m[2] ?? m[1]);
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= 79) out.push(i);

}
function renderPhotoCard() {

card.addEventListener("click", e => {

function openPhoto(id) {
