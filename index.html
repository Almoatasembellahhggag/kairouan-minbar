/* Layout: the photographs fill the window (one, or before and after side by side); tools float top-left, the panel record floats right or as a bottom sheet. */
:root {
  --bg: #f2f2ef;
  --surface: #fbfbf9;
  --fg: #24211c;
  --muted: #6a645b;
  --line: #dcdcd6;
  --accent: #8a5a36;

  --stage: #0d0b09;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141210; --surface: #1c1915; --fg: #ebe5db; --muted: #a39a8c; --line: #322c25; --accent: #d0a57a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141210; --surface: #1c1915; --fg: #ebe5db; --muted: #a39a8c; --line: #322c25; --accent: #d0a57a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--stage); color: var(--fg); font-family: var(--serif); font-size: 16px; line-height: 1.55; overflow: hidden; }

.views { position: fixed; inset: 0; display: flex; gap: 2px; background: var(--stage); }
@media (max-aspect-ratio: 1/1) { .views.both { flex-direction: column; } }
.pane { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; }
.scroll { position: absolute; inset: 0; overflow: auto; display: flex; }
.pane[hidden] { display: none !important; }
.stage { position: relative; margin: auto; flex: none; container-type: inline-size;
  width: calc(min(var(--pw), var(--ph) * var(--ar)) * var(--zf, 1)); }
.stage img { display: block; width: 100%; max-width: none; height: auto; user-select: none; -webkit-user-drag: none; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.shade { opacity: 0; transition: opacity .2s; }
.filtering .shade { opacity: 1; }
.hits polygon { fill: transparent; pointer-events: all; cursor: pointer; outline: none; }
.hits polygon:hover, .hits polygon:focus-visible { fill: rgba(232, 134, 47, .28); }
.editing .hits polygon.c1 { fill: rgba(227, 195, 74, .32); }
.editing .hits polygon.c2 { fill: rgba(47, 143, 78, .32); }
.hits polygon.sel { fill: rgba(232, 134, 47, .25); }
.outline { fill: none; stroke: var(--sel); stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(0,0,0,.8)); }
.tag { position: absolute; left: 10px; bottom: 10px; font-family: var(--label); font-size: .78rem; color: #f3ede3; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 4px; pointer-events: none; }

.mark { position: absolute; transform: translate(-50%, -50%); width: clamp(18px, 1.7cqw, 30px); height: clamp(18px, 1.7cqw, 30px);
  border-radius: 50%; border: 0; background: rgba(18, 14, 10, .6); color: #f6f1e8; padding: 0; cursor: pointer;
  font-family: var(--label); font-weight: 500; font-size: clamp(9px, .85cqw, 14px); line-height: 1; display: grid; place-items: center;
  font-variant-numeric: tabular-nums; transition: opacity .15s, background .15s; }
.mark:hover { background: rgba(18, 14, 10, .9); }
.mark.new { background: rgba(120, 40, 20, .8); }
.mark.orphan { background: rgba(170, 130, 10, .9); }
.mark.clash { background: rgba(170, 20, 20, .92); width: auto; padding: 0 6px; border-radius: 12px; }
.editing .mark.c1 { box-shadow: 0 0 0 2px #e3c34a; }
.editing .mark.c2 { background: #2f8f4e; color: #fff; }
.editing .mark.sel { background: var(--sel); box-shadow: 0 0 0 2px #fff; }
.quiet .mark:not(.sel) { opacity: 0; }
.quiet .mark:not(.sel):hover { opacity: 1; }
.filtering .mark:not(.hit):not(.sel) { opacity: .25; }
.mark.sel { background: var(--sel); color: #fff; box-shadow: 0 0 0 2px #fff; z-index: 2; }
@media (prefers-reduced-motion: reduce) { .mark, .shade { transition: none; } }

@media (min-width: 761px) { .views.docked { right: calc(min(380px, 38vw) + 20px); } .views.docked ~ .tools { max-width: calc(100vw - min(380px, 38vw) - 40px); } }
.tools { position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px);
  max-width: calc(100vw - 20px); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  box-shadow: 0 4px 18px rgba(0,0,0,.35); font-family: var(--label); font-size: .88rem; }
.tools h1 { font-family: var(--serif); font-size: 1rem; font-weight: 600; margin: 0 4px 0 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: transparent; color: var(--fg); padding: 4px 9px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.tools select, .tools input, .tools > button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.tools > button { cursor: pointer; min-width: 30px; }
.tools input { width: 4.8em; }
.edit-only[hidden] { display: none !important; }
:is(.tools button, .tools select, .tools input, .mark, .card button, summary):focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.card { position: fixed; z-index: 11; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  right: calc(env(safe-area-inset-right, 0px) + 10px); width: min(380px, 38vw); overflow: auto;
  display: flex; flex-direction: column; gap: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--line);

@media (max-width: 760px) { .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); left: calc(env(safe-area-inset-left, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); width: auto; max-height: 50vh; } }
.close { align-self: flex-end; font-family: var(--label); font-size: .85rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.head { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.head b { font-family: var(--label); font-weight: 600; font-size: 2.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.head div { display: flex; flex-direction: column; }
.head .kind { font-weight: 600; }
.head .sub { color: var(--muted); font-size: .9rem; }
.note { display: flex; flex-direction: column; gap: 2px; }
.note .src { font-family: var(--label); font-size: .78rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.note p { margin: 0; }
.note q { font-style: italic; }
.note.inf p { color: var(--muted); font-size: .93rem; }
.empty { color: var(--muted); margin: 0; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.fig img { width: 100%; height: auto; max-height: 420px; object-fit: contain; background: var(--stage); border-radius: 3px; }
.fig figcaption { font-family: var(--label); font-size: .8rem; color: var(--muted); }
.nav { display: flex; gap: 8px; }
.nav button { flex: 1; font-family: var(--label); font-size: .88rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 6px; cursor: pointer; }
.edit { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--accent); border-radius: 6px; font-family: var(--label); font-size: .9rem; }
.edit .row { display: flex; align-items: center; gap: 8px; }
.edit .field { display: flex; flex-direction: column; gap: 4px; }

.edit input[type=number] { width: 5em; }
.edit input[type=number], .edit select, .edit button:not(.seg button) { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.edit select { max-width: 100%; }
.edit button { cursor: pointer; }
.edit .hint-t { color: var(--muted); font-size: .8rem; }
.edit .warn { color: #b3261e; font-size: .85rem; }
.edit .quiet-b { align-self: flex-start; color: var(--muted); }
.seg.small { align-self: flex-start; font-size: .85rem; }
.tools .saved { color: var(--muted); }
.tools > #saveb { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.file-b { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
details { color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-family: var(--label); }
details ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

add(65, "SAL", `<q>Le n° 65 à droite est renversé; il prouve à mon avis que le mimber a dû être démonté et remonté</q> (no. 65 is reversed; in my view it proves the minbar must have been taken apart and put back together), <q>peut-être après le sac de Kairouan</q> that followed the departure of al-Muʿizz; p. 104.`);
add(76, "SAL", `Added during that old repair <q>pour remplacer un panneau détruit</q> (to replace a destroyed panel); it <q>seul comporte dans son tracé géométrique le caractère de l'ornementation arabe proprement dite</q> (alone has, in its geometric layout, the character of Arab ornament proper); p. 104.`);
add(78, "SAL", `<q>Le n° 78 est neuf et a été refait pour remplacer un panneau enlevé au moment de l'occupation française</q> (no. 78 is new, remade to replace a panel removed at the time of the French occupation); p. 104.`);

// Creswell
add(43, "CRE", `Pl. 89b, <q>the fifth panel in column III</q>: <q>divided into fifteen compartments by four horizontal and two vertical bars, which pass over and under each other</q>; corner and central outer compartments hold circles with four-leaved whorls, the two largest hold vine-leaves and grapes; p. 319.`);

add(36, "ID", `The lower panel visible in Creswell's Pl. 89b, below no. 43. Creswell does not describe it.`, true);
add(44, "CRE", `Pl. 89d, <q>the fifth panel in column IV</q>: <q>a charming arched frame in which rising and coiling tendrils form nine loops</q>, each with a five-lobed leaf or split palmette; spandrels with quatrefoils; <q>crowned by a row of stepped crenellations</q>; p. 319.`);
add(44, "ID", `The plate caption says “Column 4, 3rd panel”. Counting from the bottom, as for Pl. 89b, the arched panel is the fifth: the text is right and the caption wrong.`, true);
add(45, "CRE", `Pl. 90a: <q>the superposition of heterogenous motifs</q>. <q>At the bottom is a remarkably clear cut and well-preserved acanthus whorl, on which stands a tripod supporting a conical vase from which spring a pair of half-palmettes with a pine-cone between them</q>; p. 318.`);
add(45, "ID", `Creswell's photograph shows a vegetal panel, yet no. 45 appears in Saladin's list of geometric panels as read from the scan. One of the two readings is probably wrong; check Saladin's p. 104.`, true);
add(29, "CRE", `Pl. 90b: <q>we again find a similar superposition of motifs. Here we have a half star-shaped motif at the base of the panel, from the five points of which spring S-shaped motifs ending in half-palmettes</q>; p. 318.`);
add(37, "ID", `The plaited chain-link panel below no. 44 in Creswell's Pl. 89d. Creswell does not describe it.`, true);
add(37, "BLO", `Bloom notes that in some Kairouan panels <q>the strapwork designs of the field design actually become the frames</q> (p. 155). He names no panel; this one is a likely test case.`);

}
function setSlotNew(id, val) {
  if (val) E.slots[id] = {isNew: val}; else delete E.slots[id];
  if (val === "yes") numbersAt(id).forEach(m => setP(m, {exists: "no", slot: undefined}));
}
function renumber(n, m) {
  if (!Number.isInteger(m) || m < 1 || m > 79) { status("Use a number from 1 to 79"); return; }
  if (m === n) return;
  const a = outlineOf(n), b = outlineOf(m);
  E.numbers[a] = m; E.numbers[b] = n;
  [a, b].forEach(k => { if (E.numbers[k] === k) delete E.numbers[k]; });
  current = m; changed(); status(`Panels ${n} and ${m} swapped numbers`);
}
function stopPick() { picking = false; }

function afterNote(n) {
  const s = slotOf(n), edited = "slot" in P(n) || P(n).exists;
  if (!s) return edited ? `You marked this panel as no longer on the minbar, so nothing is outlined on Creswell's photograph.`
    : `Creswell says this panel <q>has disappeared</q>, so nothing is outlined on his photograph.`;
  if (edited) return `You placed this panel at this position on Creswell's photograph: ${slotName(s)}.`;
  if (isBal(n)) return `The balustrade was rebuilt with sixteen panels. Following Creswell's table, this panel now stands at his position ${BAL[n - 52]} from the top, outlined on his photograph.`;
  return "";
}
function renderCard() {
  if (!current && !currentSlot) return;
  if (currentSlot) return showSlot(currentSlot);
  const n = current, i = info(outlineOf(n)), notes = N[n] || [];
  const plates = [PL26.includes(n) && "XXVI", PL27.includes(n) && "XXVII"].filter(Boolean);
  const cp = plateOf(n), va = vaOf(n), an = afterNote(n);
  const figs = [cp && `<figure class="fig"><img src="cres-${cp}.jpg" alt="Creswell ${CP[cp].cap}" loading="lazy"><figcaption>Creswell 1940, ${CP[cp].cap}</figcaption></figure>`,
    va && `<figure class="fig"><img src="va-${va}.jpg" alt="Creswell photograph ${VA[va].cap}" loading="lazy"><figcaption>Creswell photograph, ${VA[va].cap}</figcaption></figure>`].filter(Boolean);
  const top = card.scrollTop;
  card.hidden = false;
  card.innerHTML = `<button class="close" id="close">Close</button>
    <div class="head"><b>${n}</b><div>
      <span class="kind">${i.kind}</span>
      <span class="sub">${i.where[0].toUpperCase() + i.where.slice(1)}</span>
      ${plates.length ? `<span class="sub">Saladin Pl. ${plates.join(" and ")}</span>` : ""}
    </div></div>
    ${editing ? editForm(n) : ""}
    ${figs.length ? `<div class="figs">${figs.join("")}</div>` : ""}
    ${an ? `<div class="note inf"><span class="src">After 1907</span><p>${an}</p></div>` : ""}
    ${notes.length ? notes.map(o => `<div class="note${o.inf ? " inf" : ""}"><span class="src">${S[o.src]}</span><p>${o.html}</p></div>`).join("")
      : `<p class="empty">No source read so far comments on this panel individually. Strzygowski (1907, col. 388) says only that each of the nearly eighty fields <q>zeigt ein anderes Muster</q> (shows a different pattern).</p>`}
    <div class="nav"><button id="prev">← ${n > 1 ? n - 1 : 79}</button><button id="next">${n < 79 ? n + 1 : 1} →</button></div>
    ${sources}`;
  card.scrollTop = top;
  $("close").onclick = () => { card.hidden = true; };
  $("prev").onclick = () => select(n > 1 ? n - 1 : 79, true);
  $("next").onclick = () => select(n < 79 ? n + 1 : 1, true);
  bindForm(n);
}
function showSlot(id) {
  current = null; currentSlot = id;
  renderMarks(); renderProgress();
  const isNew = newOf(id), ns = numbersAt(id);
  card.hidden = false; card.scrollTop = 0;
  card.innerHTML = `<button class="close" id="close">Close</button>
    <div class="head"><b>${isNew === "yes" ? "N" : "?"}</b><div><span class="kind">${isNew === "yes" ? "New panel" : "No panel assigned"}</span><span class="sub">${slotName(id)}, after 1907</span></div></div>
    ${editing ? `<form class="edit" id="edit">
      <div class="field"><span class="lab">Is the panel at this Creswell position new?</span>${seg("isNew", isNew, NEW_OPTS)}</div>
      <div class="field"><label for="e-as">Or it is Saladin's panel number</label><div class="row"><input id="e-as" type="number" min="1" max="79"><button type="button" id="e-asgo">Assign</button></div></div>
    </form>` : ""}
    ${(id === "b10" || id === "b16") ? `<div class="note"><span class="src">${S.CRE}</span><p>The balustrade <q>now consists of sixteen only, of which Nos. 10 and 16 are new, the latter being twice the width of the rest</q>; p. 317.</p></div>` : ""}
    ${id === "b16" ? `<div class="note"><span class="src">${S.PD}</span><p>The two original panels nos. 68 and 69 of the left face were replaced by a single one; p. 223.</p></div>` : ""}
    ${!ns.length && isNew !== "yes" && id[0] === "f" ? `<p class="empty">You took the panel that was here somewhere else or marked it as gone. Say whether this one is new, or which old panel it is.</p>` : ""}`;
  $("close").onclick = () => { card.hidden = true; };
  requestAnimationFrame(() => focusPanel());
  if ($("edit")) {
    $("edit").querySelectorAll("[data-set]").forEach(b => b.onclick = () => { setSlotNew(id, b.dataset.val || undefined); changed(); });
    $("e-asgo").onclick = () => { const m = +$("e-as").value; if (m >= 1 && m <= 79) { delete E.slots[id]; setP(m, {slot: id, exists: "yes"}); currentSlot = null; current = m; changed(); } };
  }
}
function select(n, scroll) {
  if (!POLY.before[n]) return;
  current = n; currentSlot = null;
  renderMarks(); renderProgress(); renderCard();
  if (location.hash !== "#panel-" + n) history.replaceState(null, "", "#panel-" + n);
  requestAnimationFrame(() => focusPanel());
  if (scroll && !editing) { const ids = [marks.before[n], slotOf(n) && marks.after[slotOf(n)], hits[n]].filter(Boolean);
    ids.forEach(b => b.scrollIntoView({block: "center", inline: "center", behavior: "smooth"})); }
}
function renderAll() { renderMarks(); renderProgress(); if (current || currentSlot) renderCard(); requestAnimationFrame(() => focusPanel()); }

const sources = `<details><summary>Sources and caveats</summary><ul>
  <li>Saladin 1899: H. Saladin, <i>La Mosquée de Sidi Okba à Kairouan</i> (Paris, 1899), pp. 104–105, fig. 52, Pl. XXVI–XXVII. Panel numbers are his.</li>
  <li>Strzygowski 1907: “Die Kanzel von Kairuan,” <i>Kunstchronik</i> N.F. 18 (1907), cols. 386–389.</li>
  <li>Dimand 1937: “Studies in Islamic Ornament I,” <i>Ars Islamica</i> 4 (1937), pp. 293–337.</li>
  <li>Creswell 1940: <i>Early Muslim Architecture</i> II (Oxford, 1940), pp. 314–319, Pl. 89–90; his prints V&amp;A 720-1929 to 726-1929.</li>
  <li>Moraitou 2001: “Umayyad ornament on early Islamic woodwork,” <i>Benaki Museum journal</i> 1 (2001), pp. 168–169.</li>
  <li>Bloom 2012: “Strapwork Designs in Western Islamic Art,” p. 155.</li>
  <li>Picotin and Déléry 2018: “Fragments d'histoire du minbar de Kairouan,” in <i>The Aghlabids and their Neighbors</i> (Leiden, 2018), pp. 207–227.</li>
  <li>Images: Saladin 1899, fig. 52; Garrigues, Tunis, no. 271 (via Wikimedia Commons); Creswell, Pl. 89a; Creswell prints, Victoria and Albert Museum. Reproduced for research and study.</li>
  </ul><p>Notes marked “Identification” are matches made by comparing photographs, not statements in the sources. Saladin's lists were read from screen captures; check them against the scan before citing. Outlines were traced separately on each photograph. For rectangles and triangles they mark the same position in the frame, which may now hold a replaced panel; for the balustrade they follow Creswell's table of moved panels.</p></details>`;

function syncSave() {
  const on = editing || view === "both";
  ["saveb", "savef", "saved"].forEach(id => { $(id).hidden = !on; });
}
function setView(v) {
  view = v;
  const show = w => v === w || (v === "both" && (w === "before" || w === partner));
  VW.forEach(w => { $("pane-" + w).hidden = !show(w); });
  $("withseg").hidden = v !== "both";
  syncSave();
  document.querySelectorAll("#withseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === partner));
  requestAnimationFrame(() => focusPanel(true));
  document.querySelectorAll("#viewseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  $("views").classList.toggle("both", v === "both");
}
document.querySelectorAll("#viewseg button").forEach(b => b.addEventListener("click", () => { setView(b.dataset.v); if (current) setTimeout(() => select(current, true), 50); }));

$("hl").addEventListener("change", e => { filter = e.target.value; renderMarks(); });
const nums = $("nums");
nums.addEventListener("click", () => {
  const on = nums.getAttribute("aria-pressed") !== "true";
  nums.setAttribute("aria-pressed", on); nums.textContent = on ? "Numbers on" : "Numbers off";
  document.querySelectorAll(".stage").forEach(s => s.classList.toggle("quiet", !on));
});
const zoom = k => VW.forEach(v => {
  const sc = $("scroll-" + v), st = $("stage-" + v);
  if (!sc.clientWidth) return;
  const fx = (sc.scrollLeft + sc.clientWidth / 2 - st.offsetLeft) / st.offsetWidth, fy = (sc.scrollTop + sc.clientHeight / 2 - st.offsetTop) / st.offsetHeight;
  setZf(v, clampN(zfs[v] * k, 1, 10));
  sc.scrollLeft = st.offsetLeft + fx * st.offsetWidth - sc.clientWidth / 2;
  sc.scrollTop = st.offsetTop + fy * st.offsetHeight - sc.clientHeight / 2;
});
$("zin").onclick = () => zoom(1.4);
$("zout").onclick = () => zoom(1 / 1.4);
$("fitb").onclick = fitAll;
document.querySelectorAll("#withseg button").forEach(b => b.addEventListener("click", () => { partner = b.dataset.w; setView("both"); }));
$("go").addEventListener("change", e => select(+e.target.value, true));
$("editb").addEventListener("click", () => {
  editing = !editing;
  $("editb").setAttribute("aria-pressed", editing); $("editb").textContent = editing ? "Done editing" : "Edit";
  document.body.classList.toggle("editing", editing);
  document.querySelectorAll(".edit-only").forEach(x => { x.hidden = !editing; });
  syncSave();
  if (!editing) { stopPick(); fitAll(); }
  if (editing && view !== "both") setView("both");
  renderAll();
  if (editing) requestAnimationFrame(() => focusPanel(true));
});
$("savef").addEventListener("click", saveFile);
$("saveb").addEventListener("click", saveNow);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && picking) { stopPick(); renderCard(); return; }
  if (e.target.matches("input, select")) return;
  if (e.key === "ArrowRight" && current) select(current < 79 ? current + 1 : 1, true);
  if (e.key === "ArrowLeft" && current) select(current > 1 ? current - 1 : 79, true);
  if (e.key === "Escape") card.hidden = true;
});

const dock = () => $("views").classList.toggle("docked", !card.hidden && !card.querySelector(".hint"));
new MutationObserver(dock).observe(card, {attributes: true, attributeFilter: ["hidden"], childList: true});

setView("before");
renderMarks(); renderProgress();
const fromHash = () => { const m = location.hash.match(/^#panel-(\d+)$/); return m ? +m[1] : null; };
window.addEventListener("hashchange", () => { const n = fromHash(); if (n) select(n, true); });
if (fromHash()) select(fromHash(), true);
else {
  card.innerHTML = `<button class="close hint" id="close">Close</button><p class="empty">Click a number to read what the sources say about that panel. Use Compare to see the 1890s photograph beside Creswell's, taken after the 1907 restoration, or beside Saladin's numbered diagram.</p>${sources}`;
  $("close").onclick = () => { card.hidden = true; };
}
loadEdits();
</script>

</body>
