const zf = {"167": 1, "168": 1};
for (const f of ["167", "168"]) {
  const d = DATA.D[f], st = $("stage-" + f), img = new Image(); img.src = d.src; img.alt = `Strzygowski, Altai-Iran (1917), ${FIG[f]}`; st.appendChild(img);
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${d.w} ${d.h}`); st.appendChild(svg);
  for (const [id, poly] of Object.entries(d.polys)) {
    const p = document.createElementNS(NS, "polygon"); p.setAttribute("points", poly.map(q => q.join(",")).join(" "));
    p.setAttribute("tabindex", "0"); p.setAttribute("role", "button"); p.setAttribute("aria-label", `Panel ${label(id)}`);
    if (unsure(id)) p.classList.add("unsure");
    p.addEventListener("click", () => clickPanel(id)); p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); clickPanel(id); } });
    svg.appendChild(p); polyEl[id] = p;
    const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]), t = document.createElementNS(NS, "text");
    const tri = id === "XII-2"; t.setAttribute("x", tri ? (Math.min(...xs) + Math.max(...xs)) / 2 + 10 : Math.min(...xs) + 10); t.setAttribute("y", tri ? Math.max(...ys) - 18 : Math.min(...ys) + 40);
    t.setAttribute("font-size", "34"); t.textContent = label(id) + (unsure(id) ? "?" : ""); svg.appendChild(t);
  }
}
function layout() {
  for (const f of ["167", "168"]) {
    const d = DATA.D[f], pane = $("pane-" + f), w = pane.clientWidth - 16, h = pane.clientHeight - 16;
    const fit = Math.min(w, h * d.w / d.h); $("stage-" + f).style.width = Math.max(120, fit * zf[f]) + "px";
  }
}
document.querySelectorAll(".pzoom button").forEach(b => b.addEventListener("click", () => {
  const f = b.closest(".pane").id.slice(5); zf[f] = b.dataset.z === "fit" ? 1 : Math.max(1, Math.min(6, zf[f] * (b.dataset.z === "in" ? 1.5 : 1 / 1.5))); layout();
}));
addEventListener("resize", layout);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => layout()); ["167", "168"].forEach(f => ro.observe($("pane-" + f))); }          // the card docking changes the panes' size

// ---- selection, card and photographs
let cardFor = null, curPhoto = "", gallery = EDIT;          // the gallery of all the photographs: open at the start of the Edit page
function paint() {
  for (const id of Object.keys(polyEl)) {
    const p = polyEl[id]; p.classList.toggle("sel", cardFor === id); p.classList.toggle("has", photosOf(id).length > 0);
    p.classList.toggle("on", !!curPhoto && panelsOf(curPhoto).includes(id));
  }
}
function clickPanel(id) { if (EDIT && curPhoto) { toggle(curPhoto, id); return; } curPhoto = ""; gallery = false; cardFor = cardFor === id ? null : id; renderCard(); paint(); }
function zoomTo(id) {
  const P = PANELS[id]; if (!P.poly) return; const f = P.fig, d = DATA.D[f], sc = $("pane-" + f).querySelector(".scroll"), st = $("stage-" + f);
  if (zf[f] < 2) { zf[f] = 2.5; layout(); }
  const k = st.clientWidth / d.w, xs = P.poly.map(q => q[0]), ys = P.poly.map(q => q[1]);
  sc.scrollTo({left: ((Math.min(...xs) + Math.max(...xs)) / 2) * k - sc.clientWidth / 2 + st.offsetLeft, top: ((Math.min(...ys) + Math.max(...ys)) / 2) * k - sc.clientHeight / 2 + st.offsetTop, behavior: "smooth"});
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fig = pid => `<figure class="fig"><img src="th/${pid}.jpg" alt="${esc(PH[pid].title)}" loading="lazy" data-big="ph/${pid}.jpg"><figcaption>${esc(PH[pid].title)}</figcaption></figure>`;
function renderCard() {
  const c = $("card"); $("views").classList.toggle("docked", !!(cardFor || curPhoto || gallery));
  if (gallery && !curPhoto && !cardFor) {
    c.innerHTML = `<div class="head"><h2>All photographs of this face (${DATA.PH.length})</h2><button class="x" data-x>Close</button></div>
      <p class="note">${EDIT ? "Choose a photograph, then click the panels it shows." : "Choose a photograph to see the panels it shows."} Placed ${placedCount()} of ${DATA.PH.length}.</p>
      <div class="gal">${DATA.PH.map(([pid, t]) => { const n = panelsOf(pid).length; return `<button data-pick="${pid}"><img src="th/${pid}.jpg" alt="" loading="lazy"><b class="${n ? "" : "none"}">${n ? n + (n > 1 ? " panels" : " panel") : "not placed yet"}</b><span>${esc(t)}</span></button>`; }).join("")}</div>`;
  } else if (curPhoto && !cardFor) {
    const ps = panelsOf(curPhoto);
    c.innerHTML = `<div class="head"><h2>${EDIT ? "Assigning a photograph" : "Photograph"}</h2><button class="x" data-all>All photographs</button><button class="x" data-x>Close</button></div>${fig(curPhoto)}
      <p class="note">${EDIT ? "Click a panel on the plates to add it to this photograph or take it off. Green panels are on it now." : "The panels it shows are green on the plates."}</p>
      <p><b>Panels on it:</b> ${ps.length ? `<span class="chips">${ps.map(id => `<button class="chip" data-go="${id}">${label(id)}</button>`).join("")}</span>` : "none yet"}</p>`;
  } else if (cardFor) {
    const id = cardFor, P = PANELS[id], [col, n] = id.split("-"), phs = photosOf(id);
    c.innerHTML = `<div class="head"><span class="id">${label(id)}</span><h2>Column ${col}, ${id === "XII-2" ? "the triangle" : ORD[+n] + " panel from the foot"}</h2><button class="x" data-x>Close</button></div>
      <p class="sub">Strzygowski, Altai-Iran (1917), ${FIG[P.fig]}. Columns are his; the panel number is this site's, counted from the foot of the column.${unsure(id) ? " This column is very dark in the plate: the outline is approximate." : ""}</p>
      <p class="quote">${esc(DATA.DES[id] || "")}</p>
      <h2>Photographs (${phs.length})</h2>${phs.length ? `<div class="figs">${phs.map(fig).join("")}</div>` : `<p class="note">No photograph assigned yet.</p>`}
      ${EDIT ? `<h2>Which photographs show it</h2><div class="checks">${DATA.PH.map(([pid, t]) => `<label><input type="checkbox" data-ph="${pid}" ${panelsOf(pid).includes(id) ? "checked" : ""}><img src="th/${pid}.jpg" alt=""><span>${esc(t)}</span></label>`).join("")}</div>` : ""}`;
  } else { c.hidden = true; c.innerHTML = ""; return; }
  c.hidden = false;
}
$("card").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-x]")) { if (cardFor) cardFor = null; else { curPhoto = ""; gallery = false; $("photo").value = ""; } renderCard(); paint(); return; }
  if (t.closest("[data-all]")) { curPhoto = ""; cardFor = null; gallery = true; $("photo").value = ""; renderCard(); paint(); return; }
  const pk = t.closest("[data-pick]"); if (pk) { curPhoto = pk.dataset.pick; cardFor = null; $("photo").value = EDIT ? curPhoto : ""; renderCard(); paint(); return; }
  if (t.dataset.go) { cardFor = null; zoomTo(t.dataset.go); return; }
  if (t.dataset.big) { const lb = $("lb"); lb.querySelector("img").src = t.dataset.big; lb.querySelector("p").textContent = t.alt; lb.classList.remove("big"); lb.hidden = false; }
});
$("card").addEventListener("change", e => { const t = e.target; if (t.dataset.ph) toggle(t.dataset.ph, cardFor); });
$("lb").addEventListener("click", e => { if (e.target.tagName === "IMG") e.currentTarget.classList.toggle("big"); else e.currentTarget.hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("lb").hidden) $("lb").hidden = true; else if (cardFor || curPhoto || gallery) { cardFor = null; curPhoto = ""; gallery = false; $("photo").value = ""; renderCard(); paint(); } } });

// ---- tools
for (const id of ORDER) $("go").insertAdjacentHTML("beforeend", `<option value="${id}">${label(id)}${unsure(id) ? "?" : ""}${PANELS[id].poly ? "" : " (cut off in the plate)"}</option>`);
$("go").addEventListener("change", e => { const id = e.target.value; if (!id) return; cardFor = id; curPhoto = EDIT ? curPhoto : ""; renderCard(); paint(); layout(); zoomTo(id); e.target.value = ""; });
$("allb").addEventListener("click", () => { curPhoto = ""; cardFor = null; gallery = true; if (EDIT) $("photo").value = ""; renderCard(); paint(); });
$("nums").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Numbers on" : "Numbers off"; document.body.classList.toggle("nonums", !on); });
if (EDIT) {
  document.querySelectorAll(".edit-only").forEach(x => x.hidden = false); $("pagelink").textContent = "View"; $("pagelink").href = "back.html";
  for (const [pid, t] of DATA.PH) $("photo").insertAdjacentHTML("beforeend", `<option value="${pid}">${esc(t.length > 70 ? t.slice(0, 68) + "…" : t)}</option>`);
  $("photo").addEventListener("change", e => { curPhoto = e.target.value; cardFor = null; gallery = !curPhoto; renderCard(); paint(); });
  $("savef").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(E, null, 1) + "\n"], {type: "application/json"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "back-edits.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("loadf").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.photos) throw 0; E = {v: 1, photos: j.photos}; lsSet(LSB, pub); lsSet(LS, E); status(); paint(); renderCard(); }
    catch (err) { $("saved").textContent = "That file could not be read"; }
  });
}
fetch("back-edits.json?" + Date.now()).then(r => r.ok ? r.json() : {v: 1, photos: {}}).catch(() => ({v: 1, photos: {}}))
  .then(j => { pub = j && j.photos ? j : {v: 1, photos: {}}; mergeLocal(); status(); paint(); renderCard(); });
layout(); requestAnimationFrame(layout);
</script>
</body>
</html>
